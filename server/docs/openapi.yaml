openapi: 3.0.3

info:
  title: Climb App API
  version: 0.1.0
  description: |
    Backend API for the climbing (bouldering) log app.

    ## Authentication
    Every endpoint except `/health` requires a **Supabase access token**:
    `Authorization: Bearer <jwt>`. Requests without a valid token get `401`;
    a suspended/withdrawn account gets `403`.

    The server derives the caller's identity from the token — sessions, goals
    and attempts are always scoped to the authenticated user, and `user_id` is
    never sent by the client. A row owned by another user is indistinguishable
    from a missing one (`404`).

    ## Conventions
    - Success payloads are wrapped in `{ "data": ... }`.
    - Errors are wrapped in `{ "error": { "message": "...", "details": ... } }`.
    - `DATE` columns (`visit_date`, `target_date`) are plain `YYYY-MM-DD` strings.
    - `TIMESTAMPTZ` columns (`created_at`, `updated_at`, `achieved_at`) are ISO 8601 date-time strings.
    - All `PATCH` endpoints accept partial bodies: omitted fields are left untouched.
    - Deleting a row still referenced by others (`ON DELETE RESTRICT`) returns `409`.
  license:
    name: MIT

servers:
  - url: http://localhost:4000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and database connectivity
  - name: Users
    description: The authenticated user's profile (provisioned automatically on first request).
  - name: Sessions
    description: Gym visits. A session groups the attempts made on one visit.
  - name: Grades
    description: Read-only master data — the V0–V17 bouldering scale (created by the seed).
  - name: Routes
    description: Climbing problems, each tied to a grade.
  - name: Attempts
    description: One try at a route within a session.
  - name: Goals
    description: A user's target grade, with optional deadline.
  - name: Stats
    description: Read-only aggregates over the user's own sessions and attempts.

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Reports server liveness and database connectivity. Public — no token required.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Server and database are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                db: up
        '503':
          description: Server is up but the database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                db: down

  /users/me:
    get:
      tags: [Users]
      summary: Get my profile
      description: >-
        Returns the authenticated user's profile row. On the very first
        authenticated request the row is created automatically from the token's
        claims (email plus `first_name` / `last_name` from `user_metadata`).
      operationId: getMe
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      description: The authenticated user's sessions, ordered by `visit_date` descending, then `session_id` descending.
      operationId: listSessions
      responses:
        '200':
          description: The user's sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Sessions]
      summary: Create a session
      description: |
        The session is created for the authenticated user.

        `attempts` may be nested to save a whole gym visit in one call: each
        entry creates a route (from `grade_id` + `route_name`) plus an attempt
        on it. Session, routes and attempts are written in a single database
        transaction, so on any failure nothing is persisted.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              visit_date: '2026-07-07'
              gym_name: The Hive
              attempts:
                - grade_id: 3
                  route_name: Yellow slab by the door
                  is_success: true
                  note: Flashed it!
      responses:
        '201':
          description: Session (and any nested attempts) created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionWithAttempts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: An `attempts[].grade_id` does not reference an existing grade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  message: 'Operation conflicts with related data (foreign key constraint)'

  /sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Sessions]
      summary: Get a session
      operationId: getSession
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Sessions]
      summary: Update a session (partial)
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
      responses:
        '200':
          description: The updated session.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sessions]
      summary: Delete a session
      description: Also deletes its attempts (`ON DELETE CASCADE`).
      operationId: deleteSession
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /grades:
    get:
      tags: [Grades]
      summary: List grades
      description: The V0–V17 scale, seeded once. Read-only.
      operationId: listGrades
      responses:
        '200':
          description: All grades.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grade'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /grades/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Grades]
      summary: Get a grade
      operationId: getGrade
      responses:
        '200':
          description: The grade.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Grade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /routes:
    get:
      tags: [Routes]
      summary: List routes
      description: >-
        Routes are created through `POST /sessions` (nested `attempts`), never
        directly.
      operationId: listRoutes
      responses:
        '200':
          description: All routes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Route'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /routes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Routes]
      summary: Get a route
      operationId: getRoute
      responses:
        '200':
          description: The route.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Routes]
      summary: Update a route (partial)
      operationId: updateRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteUpdate'
      responses:
        '200':
          description: The updated route.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Routes]
      summary: Delete a route
      description: Returns `409` while any attempt still references the route (`ON DELETE RESTRICT`).
      operationId: deleteRoute
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The route is still referenced by one or more attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  message: 'Operation conflicts with related data (foreign key constraint)'

  /attempts:
    get:
      tags: [Attempts]
      summary: List attempts
      description: >-
        All attempts across the authenticated user's sessions. Attempts are
        created through `POST /sessions` (nested `attempts`), never directly.
      operationId: listAttempts
      parameters:
        - name: session_id
          in: query
          required: false
          description: Only return attempts belonging to this session (must be one of the user's sessions).
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The user's attempts (optionally filtered by session).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttemptWithRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /attempts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Attempts]
      summary: Get an attempt
      operationId: getAttempt
      responses:
        '200':
          description: The attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AttemptWithRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Attempts]
      summary: Update an attempt (partial)
      operationId: updateAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptUpdate'
      responses:
        '200':
          description: The updated attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AttemptWithRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Attempts]
      summary: Delete an attempt
      operationId: deleteAttempt
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /goals:
    get:
      tags: [Goals]
      summary: List goals
      description: The authenticated user's goals.
      operationId: listGoals
      responses:
        '200':
          description: The user's goals.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Goals]
      summary: Create a goal
      description: The goal is created for the authenticated user. `grade_id` must reference an existing grade.
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
            example:
              grade_id: 5
              goal_description: Send my first V4 before the season ends
              target_date: '2026-09-30'
      responses:
        '201':
          description: Goal created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /goals/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Goals]
      summary: Get a goal
      operationId: getGoal
      responses:
        '200':
          description: The goal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Goals]
      summary: Update a goal (partial)
      description: >-
        `achieved_at` is derived from `is_achieved` and cannot be set directly:
        it is stamped with the current time when `is_achieved` flips to `true`
        and cleared when it flips back to `false`.
      operationId: updateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdate'
      responses:
        '200':
          description: The updated goal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Goals]
      summary: Delete a goal
      operationId: deleteGoal
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /stats:
    get:
      tags: [Stats]
      summary: Monthly statistics
      description: >-
        Everything the Progress screen renders, for one calendar month, counted
        in SQL rather than in the browser.


        Send your **local** month as `month`: the server cannot know the
        caller's timezone, so around midnight its own idea of "this month" can
        differ from the user's by a day.


        `daily` always covers every day of the month, including days with no
        session, so the charts get a continuous x-axis. `byGrade` only contains
        grades the user actually attempted that month, ordered easiest first.
      operationId: getStats
      parameters:
        - name: month
          in: query
          required: false
          description: Calendar month to report on, `YYYY-MM`. Defaults to the current UTC month.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-08'
      responses:
        '200':
          description: Statistics for the requested month. All-zero when nothing was logged.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MonthlyStats'
              example:
                data:
                  month: '2026-08'
                  summary:
                    sessions: 4
                    attempts: 7
                    sends: 4
                    sessionsChange: 2
                    sendsChange: 2
                    avgAttemptsPerSession: 1.8
                    highestGrade: { grade_name: 'V3', level: 3 }
                    nextGrade: { grade_name: 'V4', level: 4 }
                  daily:
                    - { date: '2026-08-01', sessions: 0, attempts: 0, cumulativeSessions: 0 }
                    - { date: '2026-08-02', sessions: 0, attempts: 0, cumulativeSessions: 0 }
                    - { date: '2026-08-03', sessions: 2, attempts: 4, cumulativeSessions: 2 }
                  byGrade:
                    - { grade_id: 1, grade_name: 'V0', level: 0, attempts: 1, sends: 1, fails: 0, successRate: 100 }
                    - { grade_id: 5, grade_name: 'V4', level: 4, attempts: 2, sends: 0, fails: 2, successRate: 0 }
        '400':
          description: '`month` is not a valid `YYYY-MM` value.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  message: 'month must be a YYYY-MM value, e.g. 2026-08'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase access token. On the frontend, obtain it from
        `supabase.auth.getSession()` and send it as `Authorization: Bearer <token>`.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Positive integer ID of the resource.
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'Invalid or expired token'
    BadRequest:
      description: Invalid request — malformed ID, missing required field, or wrong field type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'user_id is required and must be a positive integer'
    NotFound:
      description: No resource with the given ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'Session 42 not found'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            details:
              description: Optional extra context. Usually absent.

    Health:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [up, down]

    User:
      type: object
      description: The app-side profile of a Supabase Auth user.
      required: [user_id, auth_user_id, email, first_name, last_name, status, created_at, updated_at]
      properties:
        user_id:
          type: integer
          description: Internal ID — foreign key target for sessions/goals.
          example: 1
        auth_user_id:
          type: string
          format: uuid
          description: Supabase Auth user ID (the JWT `sub` claim).
        email:
          type: string
          format: email
          example: climber@example.com
        first_name:
          type: string
          nullable: true
          example: John
        last_name:
          type: string
          nullable: true
          example: Smith
        status:
          type: string
          enum: [active, withdrawn, suspended]
          example: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      description: A gym visit.
      required: [session_id, user_id, visit_date, gym_name, created_at, updated_at]
      properties:
        session_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        visit_date:
          type: string
          format: date
          example: '2026-07-07'
        gym_name:
          type: string
          nullable: true
          maxLength: 150
          example: The Hive
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionCreate:
      type: object
      required: [visit_date]
      properties:
        visit_date:
          type: string
          format: date
          description: 'Must match `YYYY-MM-DD`.'
        gym_name:
          type: string
          nullable: true
          maxLength: 150
        attempts:
          type: array
          description: >-
            Attempts to create atomically with the session. Each entry also
            creates the route it was climbed on.
          items:
            $ref: '#/components/schemas/SessionAttemptCreate'

    SessionAttemptCreate:
      type: object
      required: [grade_id]
      properties:
        grade_id:
          type: integer
          minimum: 1
        route_name:
          type: string
          nullable: true
          maxLength: 150
        is_success:
          type: boolean
          default: false
        note:
          type: string
          nullable: true

    SessionWithAttempts:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              items:
                $ref: '#/components/schemas/Attempt'

    SessionUpdate:
      type: object
      properties:
        visit_date:
          type: string
          format: date
          description: 'Must match `YYYY-MM-DD`.'
        gym_name:
          type: string
          nullable: true
          maxLength: 150

    Grade:
      type: object
      description: One step of the V0–V17 bouldering scale.
      required: [grade_id, grade_name, level, created_at, updated_at]
      properties:
        grade_id:
          type: integer
          example: 1
        grade_name:
          type: string
          maxLength: 20
          example: V0
        level:
          type: integer
          minimum: 0
          maximum: 17
          description: Unique ordering value, 0–17.
          example: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Route:
      type: object
      description: A climbing problem tied to a grade.
      required: [route_id, grade_id, route_name, created_at, updated_at]
      properties:
        route_id:
          type: integer
          example: 2
        grade_id:
          type: integer
          example: 3
        route_name:
          type: string
          nullable: true
          maxLength: 150
          example: Yellow slab by the door
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RouteUpdate:
      type: object
      properties:
        grade_id:
          type: integer
          minimum: 1
        route_name:
          type: string
          nullable: true
          maxLength: 150

    Attempt:
      type: object
      description: One try at a route within a session.
      required: [attempt_id, session_id, route_id, is_success, note, created_at, updated_at]
      properties:
        attempt_id:
          type: integer
          example: 10
        session_id:
          type: integer
          example: 1
        route_id:
          type: integer
          example: 2
        is_success:
          type: boolean
          example: true
        note:
          type: string
          nullable: true
          example: Flashed it!
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AttemptWithRoute:
      description: >-
        An attempt as the /attempts endpoints return it: the row itself plus
        the route name and grade joined in, so clients can display an attempt
        without fetching routes and grades separately.
      allOf:
        - $ref: '#/components/schemas/Attempt'
        - type: object
          required: [route_name, grade_name, grade_level]
          properties:
            route_name:
              type: string
              nullable: true
              example: Blue slab in the corner
            grade_name:
              type: string
              example: V5
            grade_level:
              type: integer
              example: 5

    AttemptUpdate:
      type: object
      properties:
        route_id:
          type: integer
          minimum: 1
        is_success:
          type: boolean
        note:
          type: string
          nullable: true

    Goal:
      type: object
      description: A user's target grade.
      required:
        [goal_id, user_id, grade_id, goal_description, is_achieved, achieved_at, target_date, created_at, updated_at]
      properties:
        goal_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        grade_id:
          type: integer
          example: 5
        goal_description:
          type: string
          nullable: true
          example: Send my first V4 before the season ends
        is_achieved:
          type: boolean
          example: false
        achieved_at:
          type: string
          format: date-time
          nullable: true
          description: Set automatically when `is_achieved` flips to `true`; `null` otherwise.
        target_date:
          type: string
          format: date
          nullable: true
          example: '2026-09-30'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GoalCreate:
      type: object
      required: [grade_id]
      properties:
        grade_id:
          type: integer
          minimum: 1
        goal_description:
          type: string
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
          description: 'Optional deadline. Must match `YYYY-MM-DD`.'

    GoalUpdate:
      type: object
      properties:
        grade_id:
          type: integer
          minimum: 1
        goal_description:
          type: string
          nullable: true
        is_achieved:
          type: boolean
        target_date:
          type: string
          format: date
          nullable: true
          description: 'Must match `YYYY-MM-DD`.'

    GradeRef:
      type: object
      description: A grade referred to from a statistic — just the label and its rank.
      required: [grade_name, level]
      properties:
        grade_name:
          type: string
          example: 'V4'
        level:
          type: integer
          description: Position on the V0–V17 scale, used for ordering.
          example: 4

    MonthlyStats:
      type: object
      required: [month, summary, daily, byGrade]
      properties:
        month:
          type: string
          description: The month these figures cover — echoes the request, or the default.
          example: '2026-08'
        summary:
          type: object
          required:
            [
              sessions,
              attempts,
              sends,
              sessionsChange,
              sendsChange,
              avgAttemptsPerSession,
              highestGrade,
              nextGrade,
            ]
          properties:
            sessions:
              type: integer
              description: Gym visits logged this month.
            attempts:
              type: integer
              description: Attempts logged this month, successful or not.
            sends:
              type: integer
              description: Attempts this month with `is_success = true`.
            sessionsChange:
              type: integer
              description: '`sessions` minus the previous month''s. Negative when activity dropped.'
            sendsChange:
              type: integer
              description: '`sends` minus the previous month''s. Negative when activity dropped.'
            avgAttemptsPerSession:
              type: number
              description: '`attempts / sessions`, one decimal. `0` in a month with no sessions.'
              example: 1.8
            highestGrade:
              allOf:
                - $ref: '#/components/schemas/GradeRef'
              nullable: true
              description: Hardest grade sent this month. `null` if nothing was sent.
            nextGrade:
              allOf:
                - $ref: '#/components/schemas/GradeRef'
              nullable: true
              description: >-
                Easiest grade above `highestGrade` that was attempted but not
                sent — what the user is currently projecting. `null` when every
                attempted grade was sent.

        daily:
          type: array
          description: >-
            Every day of the month in order, including days with no activity, so
            the chart x-axis has no gaps.
          items:
            type: object
            required: [date, sessions, attempts, cumulativeSessions]
            properties:
              date:
                type: string
                format: date
                example: '2026-08-03'
              sessions:
                type: integer
                description: Sessions logged that day. More than one is possible (two gyms in a day).
              attempts:
                type: integer
                description: Attempts logged that day. `0` for a session logged without attempts.
              cumulativeSessions:
                type: integer
                description: Running total of `sessions` from the first of the month.

        byGrade:
          type: array
          description: >-
            One entry per grade attempted this month, easiest first. Grades that
            were never attempted are absent rather than zero-filled.
          items:
            type: object
            required: [grade_id, grade_name, level, attempts, sends, fails, successRate]
            properties:
              grade_id:
                type: integer
              grade_name:
                type: string
                example: 'V4'
              level:
                type: integer
                example: 4
              attempts:
                type: integer
                description: Always at least 1 — a grade with no attempts is not listed.
              sends:
                type: integer
              fails:
                type: integer
              successRate:
                type: integer
                description: '`sends / attempts` as a whole percentage, 0–100.'
                example: 50
