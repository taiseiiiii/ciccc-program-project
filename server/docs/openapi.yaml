          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase access token. On the frontend, obtain it from
        `supabase.auth.getSession()` and send it as `Authorization: Bearer <token>`.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Positive integer ID of the resource.
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'Invalid or expired token'
    BadRequest:
      description: Invalid request — malformed ID, missing required field, or wrong field type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'user_id is required and must be a positive integer'
    NotFound:
      description: No resource with the given ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'Session 42 not found'
    NoClimbingData:
      description: The request is valid but the analyzed period contains no climbing data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'No climbing data between 2026-08-01 and 2026-08-31 — log a session first'
    RateLimited:
      description: >-
        Too many requests. `RateLimit-Limit` / `RateLimit-Remaining` /
        `RateLimit-Reset` say when to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'You have generated a lot of AI reports in the last hour — try again shortly'
    AIFailure:
      description: >-
        The AI service failed — `502` upstream error, `503` not configured or
        rate-limited, `504` timed out. Safe to retry after a moment (except
        when the server has no API key configured).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'AI analysis is not configured on this server (missing OPENAI_API_KEY)'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            request_id:
              type: string
              format: uuid
              description: >-
                Present on `500`s. Matches the `X-Request-Id` header and the
                server's log line — quote it in a bug report.
            details:
              description: Optional extra context. Usually absent.

    Health:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [up, down]

    UserUpdate:
      type: object
      description: >-
        The climber's own display name and language. `email`, `status`,
        `auth_user_id` and `user_id` are rejected with `400`.
      properties:
        first_name:
          type: string
          nullable: true
          maxLength: 100
        last_name:
          type: string
          nullable: true
          maxLength: 100
        locale:
          type: string
          enum: [en, ja]
          description: >-
            Cannot be cleared. The interface remembers its own language
            locally; this is what a new device inherits and what the AI coach
            writes in.

    PeriodTotals:
      type: object
      description: Headline figures for one range — a month, or all of time.
      required:
        [sessions, climbing_days, minutes, routes, attempts, sends, flashes,
         success_rate, highest_sent_grade, highest_sent_level]
      properties:
        sessions:
          type: integer
        climbing_days:
          type: integer
          description: Distinct visit dates. Two sessions in one day are one climbing day.
        minutes:
          type: integer
          description: Time on the wall. 0 when nobody recorded a duration.
        routes:
          type: integer
          description: Rows in `attempts` — routes touched, not tries.
        attempts:
          type: integer
          description: Tries across every route.
        sends:
          type: integer
        flashes:
          type: integer
          description: Routes sent first try.
        success_rate:
          type: number
          description: Sends / attempts as a percentage (0–100, one decimal). 0 when no attempts.
        highest_sent_grade:
          type: string
          nullable: true
        highest_sent_level:
          type: integer
          nullable: true

    Stats:
      type: object
      required:
        [month, today, lifetime, current_month, previous_month, months, daily,
         grade_breakdown, wall_breakdown, hold_breakdown, streak_weeks,
         personal_records, recent_sessions]
      properties:
        month:
          type: string
          example: '2026-08'
        today:
          type: string
          format: date
        lifetime:
          $ref: '#/components/schemas/PeriodTotals'
        current_month:
          $ref: '#/components/schemas/PeriodTotals'
        previous_month:
          $ref: '#/components/schemas/PeriodTotals'
        months:
          type: array
          description: The reported month plus the four before it, oldest first. Empty months are present and zeroed.
          items:
            type: object
            required: [month, sessions, attempts, sends, max_sent_level]
            properties:
              month:
                type: string
                example: '2026-08'
              sessions:
                type: integer
              attempts:
                type: integer
              sends:
                type: integer
              max_sent_level:
                type: integer
                nullable: true
                description: Hardest grade sent that month. Null for a month with no sends, so the chart shows a gap rather than a drop to V0.
        daily:
          type: array
          description: The 30 days ending on `today`. Days with no session are present, with zeros.
          items:
            type: object
            required: [date, sessions, attempts]
            properties:
              date:
                type: string
                format: date
              sessions:
                type: integer
              attempts:
                type: integer
        grade_breakdown:
          type: array
          description: The reported month, easiest grade first.
          items:
            type: object
            required: [grade_id, grade_name, level, attempts, sends, fails]
            properties:
              grade_id:
                type: integer
              grade_name:
                type: string
              level:
                type: integer
              attempts:
                type: integer
              sends:
                type: integer
              fails:
                type: integer
        wall_breakdown:
          type: array
          description: >-
            The reported month, by wall angle. A route tagged with two angles
            contributes its full try count to each, so each bar's own rate is
            meaningful but the sum across bars is not the month's total.
          items:
            $ref: '#/components/schemas/TagBreakdown'
        hold_breakdown:
          type: array
          description: The reported month, by hold type. Same counting caveat as `wall_breakdown`.
          items:
            $ref: '#/components/schemas/TagBreakdown'
        streak_weeks:
          type: integer
          description: >-
            Consecutive weeks up to `today` containing a session. Weeks, not
            days, so a rest day does not break it; the current week having no
            session yet does not break it either.
        personal_records:
          type: array
          description: The three hardest sends of all time, hardest first.
          items:
            type: object
            required: [attempt_id, grade_name, grade_level, route_name, gym_name, visit_date]
            properties:
              attempt_id:
                type: integer
              grade_name:
                type: string
              grade_level:
                type: integer
              route_name:
                type: string
                nullable: true
              gym_name:
                type: string
                nullable: true
              visit_date:
                type: string
                format: date
        recent_sessions:
          type: array
          description: The five most recent visits.
          items:
            $ref: '#/components/schemas/Session'

    TagBreakdown:
      type: object
      required: [code, label, attempts, sends, success_rate]
      properties:
        code:
          type: string
        label:
          type: string
        attempts:
          type: integer
        sends:
          type: integer
        success_rate:
          type: number
          description: Sends / attempts as a percentage (0–100, one decimal).

    User:
      type: object
      description: The app-side profile of a Supabase Auth user.
      required:
        [user_id, auth_user_id, email, first_name, last_name, status, locale,
         created_at, updated_at]
      properties:
        user_id:
          type: integer
          description: Internal ID — foreign key target for sessions/goals.
          example: 1
        auth_user_id:
          type: string
          format: uuid
          description: Supabase Auth user ID (the JWT `sub` claim).
        email:
          type: string
          format: email
          example: climber@example.com
        first_name:
          type: string
          nullable: true
          example: John
        last_name:
          type: string
          nullable: true
          example: Smith
        status:
          type: string
          enum: [active, withdrawn, suspended]
          example: active
        locale:
          type: string
          enum: [en, ja]
          description: >-
            Language for the interface on a new device, and the language AI
            reports are written in.
          example: en
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      description: A gym visit.
      required:
        [session_id, user_id, visit_date, gym_name, duration_minutes,
         created_at, updated_at]
      properties:
        session_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        visit_date:
          type: string
          format: date
          example: '2026-07-07'
        gym_name:
          type: string
          nullable: true
          maxLength: 150
          example: The Hive
        duration_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440
          description: Time on the wall. Null when the climber did not record it.
          example: 90
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionSummary:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          description: >-
            A visit as the list screen shows it. The counts come from the same
            query as the row, so a page of twenty does not cost twenty
            follow-up requests to render "8 climbs · 5 sent".
          required: [climb_count, total_attempts, total_sends]
          properties:
            climb_count:
              type: integer
              description: Routes logged on this visit.
            total_attempts:
              type: integer
              description: Times pulled on, summed across those routes.
            total_sends:
              type: integer
              description: Of those, the ones that topped out.

    SessionCreate:
      type: object
      required: [visit_date]
      properties:
        visit_date:
          type: string
          format: date
          description: 'Must match `YYYY-MM-DD`.'
        gym_name:
          type: string
          nullable: true
          maxLength: 150
        duration_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440
        attempts:
          type: array
          description: >-
            Climbs to create atomically with the session. Each entry also
            creates the route it was climbed on, and its tags.
          items:
            $ref: '#/components/schemas/SessionAttemptCreate'

    SessionAttemptCreate:
      type: object
      description: >-
        One route as climbed during the visit. `is_success` is not accepted —
        it is derived from `send_count`.
      required: [grade_id]
      properties:
        grade_id:
          type: integer
          minimum: 1
        route_name:
          type: string
          nullable: true
          maxLength: 150
        attempt_count:
          type: integer
          minimum: 1
          maximum: 200
          default: 1
          description: How many times the route was tried in this session.
        send_count:
          type: integer
          minimum: 0
          maximum: 200
          default: 0
          description: >-
            How many of those tries topped out. Must not exceed
            `attempt_count`.
        note:
          type: string
          nullable: true
          maxLength: 2000
        wall_type_ids:
          type: array
          description: Wall angles, tagged on the route. Unknown ids are rejected.
          items:
            type: integer
            minimum: 1
        hold_type_ids:
          type: array
          description: Hold types, tagged on the route. Unknown ids are rejected.
          items:
            type: integer
            minimum: 1
        weakness_type_ids:
          type: array
          description: >-
            Existing weaknesses (presets or the climber's own) cited for this
            climb.
          items:
            type: integer
            minimum: 1
        weakness_labels:
          type: array
          description: >-
            Free-text weaknesses. Each is resolved to a `weakness_types` row —
            reusing a matching preset or existing label, otherwise creating one
            the climber owns — so it is a dropdown option next time.
          items:
            type: string
            maxLength: 60

    SessionWithAttempts:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              items:
                $ref: '#/components/schemas/Attempt'

    SessionUpdate:
      type: object
      properties:
        visit_date:
          type: string
          format: date
          description: 'Must match `YYYY-MM-DD`.'
        gym_name:
          type: string
          nullable: true
          maxLength: 150
        duration_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440

    Grade:
      type: object
      description: One step of the V0–V17 bouldering scale.
      required: [grade_id, grade_name, level, created_at, updated_at]
      properties:
        grade_id:
          type: integer
          example: 1
        grade_name:
          type: string
          maxLength: 20
          example: V0
        level:
          type: integer
          minimum: 0
          maximum: 17
          description: Unique ordering value, 0–17.
          example: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Route:
      type: object
      description: A climbing problem tied to a grade.
      required: [route_id, grade_id, route_name, created_at, updated_at]
      properties:
        route_id:
          type: integer
          example: 2
        grade_id:
          type: integer
          example: 3
        route_name:
          type: string
          nullable: true
          maxLength: 150
          example: Yellow slab by the door
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Attempt:
      type: object
      description: >-
        One route as logged within a session: `attempt_count` tries of which
        `send_count` topped out. A route worked eight times before it went is
        one row with an 8, not eight rows.
      required:
        [attempt_id, session_id, route_id, attempt_count, send_count,
         is_success, note, created_at, updated_at]
      properties:
        attempt_id:
          type: integer
          example: 10
        session_id:
          type: integer
          example: 1
        route_id:
          type: integer
          example: 2
        attempt_count:
          type: integer
          minimum: 1
          example: 4
        send_count:
          type: integer
          minimum: 0
          description: Never greater than `attempt_count`.
          example: 1
        is_success:
          type: boolean
          readOnly: true
          description: >-
            Generated by the database as `send_count > 0`. Read-only —
            PATCHing it is rejected with 400.
          example: true
        note:
          type: string
          nullable: true
          example: Flashed it!
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AttemptWithRoute:
      description: >-
        A logged climb as the /attempts endpoints return it: the row itself
        plus the route name, grade and tags joined in, so clients can display
        it without fetching four more collections.
      allOf:
        - $ref: '#/components/schemas/Attempt'
        - type: object
          required:
            [route_name, grade_name, grade_level, wall_types, hold_types,
             weaknesses]
          properties:
            route_name:
              type: string
              nullable: true
              example: Blue slab in the corner
            grade_name:
              type: string
              example: V5
            grade_level:
              type: integer
              example: 5
            wall_types:
              type: array
              items:
                $ref: '#/components/schemas/TaxonomyTerm'
            hold_types:
              type: array
              items:
                $ref: '#/components/schemas/TaxonomyTerm'
            weaknesses:
              type: array
              items:
                type: object
                required: [weakness_type_id, label]
                properties:
                  weakness_type_id:
                    type: integer
                  label:
                    type: string

    AttemptUpdate:
      type: object
      description: >-
        `is_success` is rejected — send `send_count` instead.

        `route_id` is rejected too. It used to be accepted after only an
        existence check, which let a caller aim their attempt at another
        climber's route and rewrite its tags. `grade_id` and `route_name`
        correct *this* climb's own route instead.

        Tag arrays replace in full, so `[]` clears them.
      properties:
        grade_id:
          type: integer
          minimum: 1
          description: Re-grade this climb's route. Must reference an existing grade.
        route_name:
          type: string
          nullable: true
          maxLength: 150
          description: Rename this climb's route.
        attempt_count:
          type: integer
          minimum: 1
          maximum: 200
        send_count:
          type: integer
          minimum: 0
          maximum: 200
        note:
          type: string
          nullable: true
          maxLength: 2000
        wall_type_ids:
          type: array
          items:
            type: integer
        hold_type_ids:
          type: array
          items:
            type: integer
        weakness_type_ids:
          type: array
          items:
            type: integer
        weakness_labels:
          type: array
          items:
            type: string
            maxLength: 60

    Goal:
      type: object
      description: A user's target grade.
      required:
        [goal_id, user_id, grade_id, goal_description, is_achieved, achieved_at, target_date, created_at, updated_at]
      properties:
        goal_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        grade_id:
          type: integer
          example: 5
        goal_description:
          type: string
          nullable: true
          example: Send my first V4 before the season ends
        is_achieved:
          type: boolean
          example: false
        achieved_at:
          type: string
          format: date-time
          nullable: true
          description: Set automatically when `is_achieved` flips to `true`; `null` otherwise.
        target_date:
          type: string
          format: date
          nullable: true
          example: '2026-09-30'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GoalCreate:
      type: object
      required: [grade_id]
      properties:
        grade_id:
          type: integer
          minimum: 1
        goal_description:
          type: string
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
          description: 'Optional deadline. Must match `YYYY-MM-DD`.'

    GoalUpdate:
      type: object
      properties:
        grade_id:
          type: integer
          minimum: 1
        goal_description:
          type: string
          nullable: true
        is_achieved:
          type: boolean
        target_date:
          type: string
          format: date
          nullable: true
          description: 'Must match `YYYY-MM-DD`.'

    ClimbingStats:
      type: object
      description: >-
        The aggregated numbers a report was computed from — stored with the
        report so it stays interpretable after sessions are edited or deleted.
      required:
        [period_start, period_end, total_sessions, total_attempts, total_sends,
         success_rate, highest_sent_grade, highest_attempted_grade,
         grade_breakdown, gyms, notes]
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        total_sessions:
          type: integer
          example: 6
        total_attempts:
          type: integer
          example: 42
        total_sends:
          type: integer
          example: 25
        success_rate:
          type: number
          description: Sends / attempts as a percentage (0–100, one decimal).
          example: 59.5
        highest_sent_grade:
          type: string
          nullable: true
          example: V4
        highest_attempted_grade:
          type: string
          nullable: true
          example: V6
        grade_breakdown:
          type: array
          description: Attempts vs. sends per grade, ordered easiest first.
          items:
            type: object
            required: [grade_name, level, attempts, sends]
            properties:
              grade_name:
                type: string
                example: V3
              level:
                type: integer
                example: 3
              attempts:
                type: integer
                example: 12
              sends:
                type: integer
                example: 8
        gyms:
          type: array
          items:
            type: string
          example: [The Hive]
        notes:
          type: array
          description: The climber's own attempt notes from the period (capped at 20).
          items:
            type: object
            required: [visit_date, grade_name, route_name, is_success, note]
            properties:
              visit_date:
                type: string
                format: date
              grade_name:
                type: string
              route_name:
                type: string
                nullable: true
              is_success:
                type: boolean
              note:
                type: string

    Performance:
      type: object
      description: An immutable AI-generated performance report.
      required:
        [performance_id, user_id, period_type, period_start, period_end,
         performance_report, ai_model, analysis_data, created_at, updated_at]
      properties:
        performance_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        period_type:
          type: string
          enum: [daily, monthly]
        period_start:
          type: string
          format: date
          example: '2026-08-01'
        period_end:
          type: string
          format: date
          example: '2026-08-31'
        performance_report:
          type: string
          nullable: true
          description: The full report text (plain-text paragraphs).
        ai_model:
          type: string
          nullable: true
          example: gpt-4o
        analysis_data:
          type: object
          description: Structured analysis plus the stats snapshot it was computed from.
          required: [headline, grade_projection, strengths, weaknesses, focus_advice, stats]
          properties:
            headline:
              type: string
              example: Your slab game is peaking.
            grade_projection:
              type: string
              description: The V-grade the climber is trending toward.
              example: V5
            strengths:
              type: array
              items:
                type: string
            weaknesses:
              type: array
              items:
                type: string
            focus_advice:
              type: string
            stats:
              $ref: '#/components/schemas/ClimbingStats'
        title:
          $ref: '#/components/schemas/ReportTitle'
        user_note:
          $ref: '#/components/schemas/ReportUserNote'
        is_pinned:
          $ref: '#/components/schemas/ReportIsPinned'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PerformanceCreate:
      type: object
      required: [period_type]
      properties:
        period_type:
          type: string
          enum: [daily, monthly]
        date:
          type: string
          format: date
          description: >-
            Anchors the period — any day of the target day/month. Defaults to
            today (server time), so clients in other timezones should send it.

    Training:
      type: object
      description: An immutable AI-generated training plan.
      required:
        [training_id, user_id, training_report, ai_model, analysis_data,
         created_at, updated_at]
      properties:
        training_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        training_report:
          type: string
          nullable: true
          description: The narrative tying the plan together (plain-text paragraphs).
        ai_model:
          type: string
          nullable: true
          example: gpt-4o
        analysis_data:
          type: object
          description: The structured plan plus the stats snapshot it was based on.
          required: [headline, focus, drills, stats]
          properties:
            headline:
              type: string
              example: A block built around finishing what you start.
            focus:
              type: string
            drills:
              type: array
              description: Recommended exercises, most important first.
              items:
                type: object
                required: [title, description, priority, frequency]
                properties:
                  title:
                    type: string
                    example: Slab Technique Drills
                  description:
                    type: string
                  priority:
                    type: string
                    enum: [high, medium, low]
                  frequency:
                    type: string
                    example: 2x per week, 20 min
            removed_for_injury:
              type: array
              description: >-
                Drills the server dropped because they would have loaded an
                unhealed body part. Surfaced in the UI, not hidden.
              items:
                type: string
            stats:
              $ref: '#/components/schemas/ClimbingStats'
        title:
          $ref: '#/components/schemas/ReportTitle'
        user_note:
          $ref: '#/components/schemas/ReportUserNote'
        is_pinned:
          $ref: '#/components/schemas/ReportIsPinned'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TrainingCreate:
      type: object
      properties:
        date:
          type: string
          format: date
          description: >-
            End of the 30-day window the plan is based on. Defaults to today
            (server time), so clients in other timezones should send it.

    # ---- The climber's own layer on a saved report --------------------------
    # Shared by Performance and Training. The generated text next to these is
    # never editable: a report is only worth reviewing if it still says what it
    # said when it was generated.

    ReportTitle:
      type: string
      nullable: true
      maxLength: 120
      description: A name the climber gave this report.
      example: The month I finally got V5

    ReportUserNote:
      type: string
      nullable: true
      maxLength: 4000
      description: The climber's own reflection, written after the fact.
      example: The coach was right about my feet. Fixed it and V4 went in two weeks.

    ReportIsPinned:
      type: boolean
      description: Pinned reports sort to the top of the list.
      default: false

    ReportUpdate:
      type: object
      description: >-
        The only editable fields on a saved report. Sending
        `performance_report`, `training_report` or `analysis_data` is rejected
        with 400.
      properties:
        title:
          $ref: '#/components/schemas/ReportTitle'
        user_note:
          $ref: '#/components/schemas/ReportUserNote'
        is_pinned:
          type: boolean

    # ---- Tag vocabularies ---------------------------------------------------

    TaxonomyTerm:
      type: object
      description: >-
        One term from a master vocabulary — a wall angle, a hold type or a body
        part. All three have this shape.
      required: [id, code, label, sort_order]
      properties:
        id:
          type: integer
          example: 3
        code:
          type: string
          description: Stable key, safe to branch on in code.
          example: overhang
        label:
          type: string
          description: What the button says.
          example: Overhang
        sort_order:
          type: integer
          example: 30

    WeaknessType:
      type: object
      description: >-
        A self-reported reason a climb did not go. `user_id` is null for the
        shared presets and set for labels this climber typed in.
      required: [weakness_type_id, user_id, label, sort_order, created_at, updated_at]
      properties:
        weakness_type_id:
          type: integer
          example: 3
        user_id:
          type: integer
          nullable: true
          description: Null for a shared preset.
          example: null
        label:
          type: string
          maxLength: 60
          example: Footwork
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WeaknessCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 60
          description: >-
            Matched case-insensitively against the presets and the climber's
            own labels first, so submitting an existing one returns it rather
            than creating a duplicate.

    # ---- Media --------------------------------------------------------------

    Media:
      type: object
      description: >-
        Metadata for one attachment. The file itself lives in the private
        `climb-media` Supabase Storage bucket.
      required:
        [media_id, user_id, session_id, attempt_id, storage_path, kind,
         mime_type, byte_size, duration_seconds, created_at, updated_at]
      properties:
        media_id:
          type: integer
        user_id:
          type: integer
        session_id:
          type: integer
          nullable: true
        attempt_id:
          type: integer
          nullable: true
        storage_path:
          type: string
          description: >-
            Object key in the bucket. Always begins with the uploader's
            `auth_user_id`, matching the bucket's RLS policy.
          example: 8f1c.../2026/08/2b7e....jpg
        kind:
          type: string
          enum: [photo, video]
        mime_type:
          type: string
          example: image/jpeg
        byte_size:
          type: integer
          format: int64
        duration_seconds:
          type: integer
          nullable: true
          description: Videos only.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MediaPresignRequest:
      type: object
      description: >-
        Describes a file before it is uploaded. At least one of `session_id` /
        `attempt_id` is required, and it must belong to the caller. `mime_type`
        and `byte_size` are signed into the returned URL, so the upload has to
        match them.
      required: [kind, mime_type, byte_size]
      properties:
        kind:
          type: string
          enum: [photo, video]
        mime_type:
          type: string
          description: >-
            Photos: image/jpeg, image/png, image/webp, image/heic.
            Videos: video/mp4, video/quicktime, video/webm.
        byte_size:
          type: integer
          format: int64
          description: 'Max 8 MB for photos, 50 MB for videos.'
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 120
          description: Required for videos.
        session_id:
          type: integer
        attempt_id:
          type: integer

    MediaCreate:
      type: object
      description: >-
        Posted after the file has been PUT to the presigned URL. Carries the
        same fields as the presign request plus the `storage_path` it returned.
        At least one of `session_id` / `attempt_id` is required, and it must
        belong to the caller.
      required: [storage_path, kind, mime_type, byte_size]
      properties:
        storage_path:
          type: string
        kind:
          type: string
          enum: [photo, video]
        mime_type:
          type: string
          description: >-
            Photos: image/jpeg, image/png, image/webp, image/heic.
            Videos: video/mp4, video/quicktime, video/webm.
        byte_size:
          type: integer
          format: int64
          description: 'Max 8 MB for photos, 50 MB for videos.'
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 120
          description: Required for videos.
        session_id:
          type: integer
        attempt_id:
          type: integer

    MediaUsage:
      type: object
      required:
        [used_bytes, limit_bytes, max_photo_bytes, max_video_bytes,
         max_video_seconds]
      properties:
        used_bytes:
          type: integer
          format: int64
        limit_bytes:
          type: integer
          format: int64
          description: Per-account ceiling, so one climber cannot fill the bucket.
        max_photo_bytes:
          type: integer
        max_video_bytes:
          type: integer
        max_video_seconds:
          type: integer

    # ---- Injuries -----------------------------------------------------------

    Injury:
      type: object
      description: >-
        An injury being tracked. Carries no diagnosis and no treatment: the API
        records what the climber can observe and what the AI coach needs in
        order to route training around it.
      required:
        [injury_id, user_id, body_part_id, side, occurred_on, status, severity,
         description, resolved_on, body_part_code, body_part_label,
         latest_pain_level, latest_logged_on, created_at, updated_at]
      properties:
        injury_id:
          type: integer
        user_id:
          type: integer
        body_part_id:
          type: integer
        side:
          type: string
          nullable: true
          enum: [left, right, both, null]
        occurred_on:
          type: string
          format: date
        status:
          type: string
          enum: [active, recovering, healed]
          description: >-
            `active` and `recovering` both constrain training plans; `healed`
            is history only.
        severity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        description:
          type: string
          nullable: true
        resolved_on:
          type: string
          format: date
          nullable: true
          description: >-
            Set automatically when status becomes `healed`, cleared when it is
            reopened.
        body_part_code:
          type: string
          example: finger
        body_part_label:
          type: string
          example: Finger / pulley
        latest_pain_level:
          type: integer
          nullable: true
          description: Most recent check-in, joined in so a list needs no extra request.
        latest_logged_on:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InjuryCreate:
      type: object
      required: [body_part_id, occurred_on]
      properties:
        body_part_id:
          type: integer
          minimum: 1
        occurred_on:
          type: string
          format: date
          description: Cannot be in the future.
        side:
          type: string
          nullable: true
          enum: [left, right, both, null]
        severity:
          type: integer
          minimum: 1
          maximum: 5
        description:
          type: string
          nullable: true
          maxLength: 2000

    InjuryUpdate:
      type: object
      properties:
        body_part_id:
          type: integer
          minimum: 1
        occurred_on:
          type: string
          format: date
        side:
          type: string
          nullable: true
          enum: [left, right, both, null]
        status:
          type: string
          enum: [active, recovering, healed]
        severity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        description:
          type: string
          nullable: true
          maxLength: 2000

    InjuryLog:
      type: object
      description: One daily pain check-in. At most one per injury per day.
      required:
        [injury_log_id, injury_id, logged_on, pain_level, note, created_at,
         updated_at]
      properties:
        injury_log_id:
          type: integer
        injury_id:
          type: integer
        logged_on:
          type: string
          format: date
        pain_level:
          type: integer
          minimum: 0
          maximum: 10
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InjuryLogCreate:
      type: object
      required: [pain_level]
      properties:
        pain_level:
          type: integer
          minimum: 0
          maximum: 10
        logged_on:
          type: string
          format: date
          description: >-
            Defaults to the server's today. Clients should send their own local
            date.
        note:
          type: string
          nullable: true
          maxLength: 1000
