        `GET /performances`.
      operationId: listTrainings
      parameters:
        - name: is_pinned
          in: query
          required: false
          description: >-
            `true` returns only pinned plans, `false` only unpinned. Omit for
            both.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Maximum number of plans to return (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
