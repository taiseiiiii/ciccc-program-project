openapi: 3.0.3

info:
  title: Climb App API
  version: 0.1.0
  description: |
    Backend API for the climbing (bouldering) log app.

    ## Authentication
    Every endpoint except `/health` requires a **Supabase access token**:
    `Authorization: Bearer <jwt>`. Requests without a valid token get `401`;
    a suspended/withdrawn account gets `403`.

    The server derives the caller's identity from the token — sessions, goals
    and attempts are always scoped to the authenticated user, and `user_id` is
    never sent by the client. A row owned by another user is indistinguishable
    from a missing one (`404`).

    ## Conventions
    - Success payloads are wrapped in `{ "data": ... }`.
    - Errors are wrapped in `{ "error": { "message": "...", "details": ... } }`.
    - `DATE` columns (`visit_date`, `target_date`) are plain `YYYY-MM-DD` strings.
    - `TIMESTAMPTZ` columns (`created_at`, `updated_at`, `achieved_at`) are ISO 8601 date-time strings.
    - All `PATCH` endpoints accept partial bodies: omitted fields are left untouched.
    - Deleting a row still referenced by others (`ON DELETE RESTRICT`) returns `409`.

    ## AI reports
    `POST /performances` and `POST /trainings` generate coaching reports with
    OpenAI (GPT-4o) synchronously — expect a few seconds of latency. They
    answer `422` when the analyzed period contains no climbing data, and
    `502` / `503` / `504` when the AI service fails, is not configured, or
    times out. Generated reports are immutable snapshots: regenerating adds a
    new row instead of updating an old one.
  license:
    name: MIT

servers:
  - url: http://localhost:4000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and database connectivity
  - name: Users
    description: The authenticated user's profile (provisioned automatically on first request).
  - name: Sessions
    description: Gym visits. A session groups the attempts made on one visit.
  - name: Grades
    description: Read-only master data — the V0–V17 bouldering scale (created by the seed).
  - name: Routes
    description: Climbing problems, each tied to a grade.
  - name: Attempts
    description: One try at a route within a session.
  - name: Goals
    description: A user's target grade, with optional deadline.
  - name: Performances
    description: AI-generated performance analysis of one day or month of climbing.
  - name: Trainings
    description: AI-generated training plans based on the last 30 days of climbing.

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Reports server liveness and database connectivity. Public — no token required.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Server and database are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                db: up
        '503':
          description: Server is up but the database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                db: down

  /users/me:
    get:
      tags: [Users]
      summary: Get my profile
      description: >-
        Returns the authenticated user's profile row. On the very first
        authenticated request the row is created automatically from the token's
        claims (email plus `first_name` / `last_name` from `user_metadata`).
      operationId: getMe
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      description: The authenticated user's sessions, ordered by `visit_date` descending, then `session_id` descending.
      operationId: listSessions
      responses:
        '200':
          description: The user's sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Sessions]
      summary: Create a session
      description: |
        The session is created for the authenticated user.

        `attempts` may be nested to save a whole gym visit in one call: each
        entry creates a route (from `grade_id` + `route_name`) plus an attempt
        on it. Session, routes and attempts are written in a single database
        transaction, so on any failure nothing is persisted.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              visit_date: '2026-07-07'
              gym_name: The Hive
              attempts:
                - grade_id: 3
                  route_name: Yellow slab by the door
                  is_success: true
                  note: Flashed it!
      responses:
        '201':
          description: Session (and any nested attempts) created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionWithAttempts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: An `attempts[].grade_id` does not reference an existing grade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  message: 'Operation conflicts with related data (foreign key constraint)'

  /sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Sessions]
      summary: Get a session
      operationId: getSession
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Sessions]
      summary: Update a session (partial)
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
      responses:
        '200':
          description: The updated session.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sessions]
      summary: Delete a session
      description: Also deletes its attempts (`ON DELETE CASCADE`).
      operationId: deleteSession
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /grades:
    get:
      tags: [Grades]
      summary: List grades
      description: The V0–V17 scale, seeded once. Read-only.
      operationId: listGrades
      responses:
        '200':
          description: All grades.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grade'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /grades/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Grades]
      summary: Get a grade
      operationId: getGrade
      responses:
        '200':
          description: The grade.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Grade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /routes:
    get:
      tags: [Routes]
      summary: List routes
      description: >-
        Routes are created through `POST /sessions` (nested `attempts`), never
        directly.
      operationId: listRoutes
      responses:
        '200':
          description: All routes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Route'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /routes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Routes]
      summary: Get a route
      operationId: getRoute
      responses:
        '200':
          description: The route.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Routes]
      summary: Update a route (partial)
      operationId: updateRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteUpdate'
      responses:
        '200':
          description: The updated route.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Routes]
      summary: Delete a route
      description: Returns `409` while any attempt still references the route (`ON DELETE RESTRICT`).
      operationId: deleteRoute
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The route is still referenced by one or more attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  message: 'Operation conflicts with related data (foreign key constraint)'

  /attempts:
    get:
      tags: [Attempts]
      summary: List attempts
      description: >-
        All attempts across the authenticated user's sessions. Attempts are
        created through `POST /sessions` (nested `attempts`), never directly.
      operationId: listAttempts
      parameters:
        - name: session_id
          in: query
          required: false
          description: Only return attempts belonging to this session (must be one of the user's sessions).
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The user's attempts (optionally filtered by session).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /attempts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Attempts]
      summary: Get an attempt
      operationId: getAttempt
      responses:
        '200':
          description: The attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Attempts]
      summary: Update an attempt (partial)
      operationId: updateAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptUpdate'
      responses:
        '200':
          description: The updated attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Attempts]
      summary: Delete an attempt
      operationId: deleteAttempt
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /goals:
    get:
      tags: [Goals]
      summary: List goals
      description: The authenticated user's goals.
      operationId: listGoals
      responses:
        '200':
          description: The user's goals.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Goals]
      summary: Create a goal
      description: The goal is created for the authenticated user. `grade_id` must reference an existing grade.
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
            example:
              grade_id: 5
              goal_description: Send my first V4 before the season ends
              target_date: '2026-09-30'
      responses:
        '201':
          description: Goal created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /goals/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Goals]
      summary: Get a goal
      operationId: getGoal
      responses:
        '200':
          description: The goal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Goals]
      summary: Update a goal (partial)
      description: >-
        `achieved_at` is derived from `is_achieved` and cannot be set directly:
        it is stamped with the current time when `is_achieved` flips to `true`
        and cleared when it flips back to `false`.
      operationId: updateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdate'
      responses:
        '200':
          description: The updated goal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Goals]
      summary: Delete a goal
      operationId: deleteGoal
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /performances:
    get:
      tags: [Performances]
      summary: List performance reports
      description: The authenticated user's AI performance reports, newest first.
      operationId: listPerformances
      parameters:
        - name: period_type
          in: query
          required: false
          description: Only reports of this period type.
          schema:
            type: string
            enum: [daily, monthly]
        - name: limit
          in: query
          required: false
          description: Maximum number of reports to return (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: The user's performance reports.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Performance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Performances]
      summary: Generate a performance report
      description: >-
        Aggregates the period's sessions/attempts, has the AI coach analyze
        them, and stores the result. `date` anchors the period — any day of the
        target day/month, defaulting to today. Synchronous; expect a few
        seconds of latency.
      operationId: createPerformance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceCreate'
            example:
              period_type: monthly
              date: '2026-08-06'
      responses:
        '201':
          description: Report generated and stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Performance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/NoClimbingData'
        '502':
          $ref: '#/components/responses/AIFailure'
        '503':
          $ref: '#/components/responses/AIFailure'
        '504':
          $ref: '#/components/responses/AIFailure'

  /performances/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Performances]
      summary: Get a performance report
      operationId: getPerformance
      responses:
        '200':
          description: The performance report.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Performance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Performances]
      summary: Delete a performance report
      operationId: deletePerformance
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trainings:
    get:
      tags: [Trainings]
      summary: List training plans
      description: The authenticated user's AI training plans, newest first.
      operationId: listTrainings
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of plans to return (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: The user's training plans.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Training'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Trainings]
      summary: Generate a training plan
      description: >-
        Aggregates the last 30 days of climbing (ending at `date`, defaulting
        to today), has the AI coach design a plan targeting the visible
        weaknesses and the user's goals, and stores the result. Synchronous;
        expect a few seconds of latency.
      operationId: createTraining
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingCreate'
            example:
              date: '2026-08-06'
      responses:
        '201':
          description: Plan generated and stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Training'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/NoClimbingData'
        '502':
          $ref: '#/components/responses/AIFailure'
        '503':
          $ref: '#/components/responses/AIFailure'
        '504':
          $ref: '#/components/responses/AIFailure'

  /trainings/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Trainings]
      summary: Get a training plan
      operationId: getTraining
      responses:
        '200':
          description: The training plan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Training'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Trainings]
      summary: Delete a training plan
      operationId: deleteTraining
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase access token. On the frontend, obtain it from
        `supabase.auth.getSession()` and send it as `Authorization: Bearer <token>`.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Positive integer ID of the resource.
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'Invalid or expired token'
    BadRequest:
      description: Invalid request — malformed ID, missing required field, or wrong field type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'user_id is required and must be a positive integer'
    NotFound:
      description: No resource with the given ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'Session 42 not found'
    NoClimbingData:
      description: The request is valid but the analyzed period contains no climbing data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'No climbing data between 2026-08-01 and 2026-08-31 — log a session first'
    AIFailure:
      description: >-
        The AI service failed — `502` upstream error, `503` not configured or
        rate-limited, `504` timed out. Safe to retry after a moment (except
        when the server has no API key configured).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              message: 'AI analysis is not configured on this server (missing OPENAI_API_KEY)'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            details:
              description: Optional extra context. Usually absent.

    Health:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [up, down]

    User:
      type: object
      description: The app-side profile of a Supabase Auth user.
      required: [user_id, auth_user_id, email, first_name, last_name, status, created_at, updated_at]
      properties:
        user_id:
          type: integer
          description: Internal ID — foreign key target for sessions/goals.
          example: 1
        auth_user_id:
          type: string
          format: uuid
          description: Supabase Auth user ID (the JWT `sub` claim).
        email:
          type: string
          format: email
          example: climber@example.com
        first_name:
          type: string
          nullable: true
          example: John
        last_name:
          type: string
          nullable: true
          example: Smith
        status:
          type: string
          enum: [active, withdrawn, suspended]
          example: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      description: A gym visit.
      required: [session_id, user_id, visit_date, gym_name, created_at, updated_at]
      properties:
        session_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        visit_date:
          type: string
          format: date
          example: '2026-07-07'
        gym_name:
          type: string
          nullable: true
          maxLength: 150
          example: The Hive
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionCreate:
      type: object
      required: [visit_date]
      properties:
        visit_date:
          type: string
          format: date
          description: 'Must match `YYYY-MM-DD`.'
        gym_name:
          type: string
          nullable: true
          maxLength: 150
        attempts:
          type: array
          description: >-
            Attempts to create atomically with the session. Each entry also
            creates the route it was climbed on.
          items:
            $ref: '#/components/schemas/SessionAttemptCreate'

    SessionAttemptCreate:
      type: object
      required: [grade_id]
      properties:
        grade_id:
          type: integer
          minimum: 1
        route_name:
          type: string
          nullable: true
          maxLength: 150
        is_success:
          type: boolean
          default: false
        note:
          type: string
          nullable: true

    SessionWithAttempts:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              items:
                $ref: '#/components/schemas/Attempt'

    SessionUpdate:
      type: object
      properties:
        visit_date:
          type: string
          format: date
          description: 'Must match `YYYY-MM-DD`.'
        gym_name:
          type: string
          nullable: true
          maxLength: 150

    Grade:
      type: object
      description: One step of the V0–V17 bouldering scale.
      required: [grade_id, grade_name, level, created_at, updated_at]
      properties:
        grade_id:
          type: integer
          example: 1
        grade_name:
          type: string
          maxLength: 20
          example: V0
        level:
          type: integer
          minimum: 0
          maximum: 17
          description: Unique ordering value, 0–17.
          example: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Route:
      type: object
      description: A climbing problem tied to a grade.
      required: [route_id, grade_id, route_name, created_at, updated_at]
      properties:
        route_id:
          type: integer
          example: 2
        grade_id:
          type: integer
          example: 3
        route_name:
          type: string
          nullable: true
          maxLength: 150
          example: Yellow slab by the door
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RouteUpdate:
      type: object
      properties:
        grade_id:
          type: integer
          minimum: 1
        route_name:
          type: string
          nullable: true
          maxLength: 150

    Attempt:
      type: object
      description: One try at a route within a session.
      required: [attempt_id, session_id, route_id, is_success, note, created_at, updated_at]
      properties:
        attempt_id:
          type: integer
          example: 10
        session_id:
          type: integer
          example: 1
        route_id:
          type: integer
          example: 2
        is_success:
          type: boolean
          example: true
        note:
          type: string
          nullable: true
          example: Flashed it!
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AttemptUpdate:
      type: object
      properties:
        route_id:
          type: integer
          minimum: 1
        is_success:
          type: boolean
        note:
          type: string
          nullable: true

    Goal:
      type: object
      description: A user's target grade.
      required:
        [goal_id, user_id, grade_id, goal_description, is_achieved, achieved_at, target_date, created_at, updated_at]
      properties:
        goal_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        grade_id:
          type: integer
          example: 5
        goal_description:
          type: string
          nullable: true
          example: Send my first V4 before the season ends
        is_achieved:
          type: boolean
          example: false
        achieved_at:
          type: string
          format: date-time
          nullable: true
          description: Set automatically when `is_achieved` flips to `true`; `null` otherwise.
        target_date:
          type: string
          format: date
          nullable: true
          example: '2026-09-30'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GoalCreate:
      type: object
      required: [grade_id]
      properties:
        grade_id:
          type: integer
          minimum: 1
        goal_description:
          type: string
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
          description: 'Optional deadline. Must match `YYYY-MM-DD`.'

    GoalUpdate:
      type: object
      properties:
        grade_id:
          type: integer
          minimum: 1
        goal_description:
          type: string
          nullable: true
        is_achieved:
          type: boolean
        target_date:
          type: string
          format: date
          nullable: true
          description: 'Must match `YYYY-MM-DD`.'

    ClimbingStats:
      type: object
      description: >-
        The aggregated numbers a report was computed from — stored with the
        report so it stays interpretable after sessions are edited or deleted.
      required:
        [period_start, period_end, total_sessions, total_attempts, total_sends,
         success_rate, highest_sent_grade, highest_attempted_grade,
         grade_breakdown, gyms, notes]
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        total_sessions:
          type: integer
          example: 6
        total_attempts:
          type: integer
          example: 42
        total_sends:
          type: integer
          example: 25
        success_rate:
          type: number
          description: Sends / attempts as a percentage (0–100, one decimal).
          example: 59.5
        highest_sent_grade:
          type: string
          nullable: true
          example: V4
        highest_attempted_grade:
          type: string
          nullable: true
          example: V6
        grade_breakdown:
          type: array
          description: Attempts vs. sends per grade, ordered easiest first.
          items:
            type: object
            required: [grade_name, level, attempts, sends]
            properties:
              grade_name:
                type: string
                example: V3
              level:
                type: integer
                example: 3
              attempts:
                type: integer
                example: 12
              sends:
                type: integer
                example: 8
        gyms:
          type: array
          items:
            type: string
          example: [The Hive]
        notes:
          type: array
          description: The climber's own attempt notes from the period (capped at 20).
          items:
            type: object
            required: [visit_date, grade_name, route_name, is_success, note]
            properties:
              visit_date:
                type: string
                format: date
              grade_name:
                type: string
              route_name:
                type: string
                nullable: true
              is_success:
                type: boolean
              note:
                type: string

    Performance:
      type: object
      description: An immutable AI-generated performance report.
      required:
        [performance_id, user_id, period_type, period_start, period_end,
         performance_report, ai_model, analysis_data, created_at, updated_at]
      properties:
        performance_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        period_type:
          type: string
          enum: [daily, monthly]
        period_start:
          type: string
          format: date
          example: '2026-08-01'
        period_end:
          type: string
          format: date
          example: '2026-08-31'
        performance_report:
          type: string
          nullable: true
          description: The full report text (plain-text paragraphs).
        ai_model:
          type: string
          nullable: true
          example: gpt-4o
        analysis_data:
          type: object
          description: Structured analysis plus the stats snapshot it was computed from.
          required: [headline, grade_projection, strengths, weaknesses, focus_advice, stats]
          properties:
            headline:
              type: string
              example: Your slab game is peaking.
            grade_projection:
              type: string
              description: The V-grade the climber is trending toward.
              example: V5
            strengths:
              type: array
              items:
                type: string
            weaknesses:
              type: array
              items:
                type: string
            focus_advice:
              type: string
            stats:
              $ref: '#/components/schemas/ClimbingStats'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PerformanceCreate:
      type: object
      required: [period_type]
      properties:
        period_type:
          type: string
          enum: [daily, monthly]
        date:
          type: string
          format: date
          description: >-
            Anchors the period — any day of the target day/month. Defaults to
            today (server time), so clients in other timezones should send it.

    Training:
      type: object
      description: An immutable AI-generated training plan.
      required:
        [training_id, user_id, training_report, ai_model, analysis_data,
         created_at, updated_at]
      properties:
        training_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        training_report:
          type: string
          nullable: true
          description: The narrative tying the plan together (plain-text paragraphs).
        ai_model:
          type: string
          nullable: true
          example: gpt-4o
        analysis_data:
          type: object
          description: The structured plan plus the stats snapshot it was based on.
          required: [headline, focus, drills, stats]
          properties:
            headline:
              type: string
              example: A block built around finishing what you start.
            focus:
              type: string
            drills:
              type: array
              description: Recommended exercises, most important first.
              items:
                type: object
                required: [title, description, priority, frequency]
                properties:
                  title:
                    type: string
                    example: Slab Technique Drills
                  description:
                    type: string
                  priority:
                    type: string
                    enum: [high, medium, low]
                  frequency:
                    type: string
                    example: 2x per week, 20 min
            stats:
              $ref: '#/components/schemas/ClimbingStats'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TrainingCreate:
      type: object
      properties:
        date:
          type: string
          format: date
          description: >-
            End of the 30-day window the plan is based on. Defaults to today
            (server time), so clients in other timezones should send it.
