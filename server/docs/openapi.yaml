  # ---- Media ----------------------------------------------------------------

  /media:
    get:
      tags: [Media]
      summary: List attachments
      operationId: listMedia
      parameters:
        - name: session_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: attempt_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The climber's attachments, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Media]
      summary: Record an uploaded file
      description: |
        Called **after** the browser has PUT the file to the `upload_url` from
        `POST /media/presign`. This API never receives a file body.

        The server asks storage for the object before writing the row, and
        rejects the request if it is not there or is a different size than
        `byte_size` claims — the quota is computed from these rows, so a row
        that describes a file which was never uploaded would corrupt it.

        `storage_path` must be one this server issued, under the caller's own
        `auth_user_id` prefix.

        The path is UNIQUE, so a retried POST after a dropped response returns
        the existing row instead of attaching the same file twice.
      operationId: createMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCreate'
      responses:
        '201':
          description: Attachment recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: File too large, or the account's storage limit is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  message: 'Videos must be 50 MB or smaller'

  /media/presign:
    post:
      tags: [Media]
      summary: Get a URL to upload one file to
      description: |
        The first half of an upload. Describe the file you are about to send
        and, if the caller owns the parent and has room in their quota, the
        response carries the key it will live under and a URL to PUT it to.

        The declared `mime_type` and `byte_size` are signed into that URL, so
        an upload that does not match is refused by storage itself. The key is
        chosen here rather than by the client.

        No row is written. An upload that never happens leaves nothing behind;
        post to `/media` once the bytes are there.
      operationId: presignMediaUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPresignRequest'
      responses:
        '200':
          description: Upload URL issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [storage_path, upload_url]
                    properties:
                      storage_path:
                        type: string
                        description: The key to send back to `POST /media`.
                        example: 8f1c.../2026/08/9b2e....jpg
                      upload_url:
                        type: string
                        format: uri
                        description: PUT the file here. Valid for 10 minutes.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: File too large, or the account's storage limit is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: File storage is not configured on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /media/urls:
    post:
      tags: [Media]
      summary: Signed display URLs for a batch of attachments
      description: |
        Stored files are private, so showing one means asking for a signed URL.
        Signed in a batch because a session with a dozen photos would otherwise
        cost a dozen round trips to render one strip of thumbnails.

        A POST rather than a GET because a session's worth of keys does not
        belong in a query string; nothing is created.

        Only keys the caller has a row for are signed. Anything else is simply
        absent from the response, so a guessed key reads like a deleted one.
      operationId: signMediaUrls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage_paths]
              properties:
                storage_paths:
                  type: array
                  maxItems: 100
                  items:
                    type: string
      responses:
        '200':
          description: A URL per key that resolved. Valid for one hour.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [urls]
                    properties:
                      urls:
                        type: object
                        additionalProperties:
                          type: string
                          format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/usage:
    get:
      tags: [Media]
      summary: Storage usage and limits
      description: What the upload UI needs to warn before a climber hits the ceiling.
      operationId: getMediaUsage
      responses:
        '200':
          description: Usage and the current limits.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MediaUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    delete:
      tags: [Media]
      summary: Delete an attachment
      description: >-
        Deletes the row and the stored file. Answers 200 with the object key
        rather than 204 — kept from when the client had to delete the file
        itself, and still useful for dropping a cached thumbnail.
      operationId: deleteMedia
      responses:
        '200':
          description: Row and stored file deleted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [media_id, storage_path]
                    properties:
                      media_id:
                        type: integer
                      storage_path:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

