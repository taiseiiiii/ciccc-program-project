  # ---- Weaknesses -----------------------------------------------------------

  /weaknesses:
    get:
      tags: [Weaknesses]
      summary: List weaknesses
      description: >-
        The shared presets plus this climber's own labels, presets first.
      operationId: listWeaknesses
      responses:
        '200':
          description: The available weaknesses.
          content:
            application/json:
              schema:
                type: object
                required: [data]
