openapi: 3.0.3

info:
  title: Climb App API
  version: 0.1.0
  description: |
    Backend API for the climbing (bouldering) log app.

    ## Authentication
    Every endpoint except `/health` requires a **Supabase access token**:
    `Authorization: Bearer <jwt>`. Requests without a valid token get `401`;
    a suspended/withdrawn account gets `403`.

    The server derives the caller's identity from the token — sessions, goals
    and attempts are always scoped to the authenticated user, and `user_id` is
    never sent by the client. A row owned by another user is indistinguishable
    from a missing one (`404`).

    ## Conventions
    - Success payloads are wrapped in `{ "data": ... }`.
    - Errors are wrapped in `{ "error": { "message": "...", "details": ... } }`.
    - `DATE` columns (`visit_date`, `target_date`) are plain `YYYY-MM-DD` strings.
    - `TIMESTAMPTZ` columns (`created_at`, `updated_at`, `achieved_at`) are ISO 8601 date-time strings.
    - All `PATCH` endpoints accept partial bodies: omitted fields are left untouched.
    - Deleting a row still referenced by others (`ON DELETE RESTRICT`) returns `409`.
    - Every response carries an `X-Request-Id`; a `500` repeats it as
      `error.request_id`, which is what to quote in a bug report.

    ## Rate limits
    Two limits, both answering `429` with the usual error envelope:

    - the whole API, 300 requests per minute per IP (`/health` exempt), with
      `RateLimit-*` headers. In-memory, so it is best-effort across instances;
      the cost of letting a few extra requests through is a little CPU.
    - `POST /performances` and `POST /trainings` share an allowance of 10 per
      hour per **user** — each is one paid model call. Counted from the rows
      already generated rather than in memory, so it survives a restart and
      holds across every instance. This is the spending limit.

    ## AI reports
    `POST /performances` and `POST /trainings` generate coaching reports with
    OpenAI (GPT-4o) synchronously — expect a few seconds of latency. They
    answer `422` when the analyzed period contains no climbing data, and
    `502` / `503` / `504` when the AI service fails, is not configured, or
    times out. Generated reports are immutable snapshots: regenerating adds a
    new row instead of updating an old one.
  license:
    name: MIT

servers:
  - url: http://localhost:4000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and database connectivity
  - name: Users
    description: The authenticated user's profile (provisioned automatically on first request).
  - name: Sessions
    description: Gym visits. A session groups the attempts made on one visit.
  - name: Grades
    description: Read-only master data — the V0–V17 bouldering scale (created by the seed).
  - name: Routes
    description: Climbing problems, each tied to a grade.
  - name: Attempts
    description: >-
      One route as logged within a session — how many times it was tried and
      how many of those tries were sent.
  - name: Goals
    description: A user's target grade, with optional deadline.
  - name: Taxonomy
    description: >-
      Read-only master data for the tag pickers — wall angles, hold types and
      body parts. Created by migrations, so safe to cache indefinitely.
  - name: Weaknesses
    description: >-
      Self-reported reasons a climb did not go. Shared presets plus labels the
      climber typed in themselves.
  - name: Media
    description: >-
      Photo/video metadata. Files live in Supabase Storage and are uploaded by
      the browser directly; this API only ever handles the object key.
  - name: Injuries
    description: >-
      Injury records and daily pain check-ins. Recording and load management
      only — the API stores no diagnosis or treatment.
  - name: Stats
    description: >-
      Counted-up figures for the Dashboard and Progress screens. One response
      replaces fetching the whole history and aggregating it in the browser.
  - name: Performances
    description: AI-generated performance analysis of one day or month of climbing.
  - name: Trainings
    description: AI-generated training plans based on the last 30 days of climbing.

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Reports server liveness and database connectivity. Public — no token required.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Server and database are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                db: up
        '503':
          description: Server is up but the database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                db: down

  /users/me:
    get:
      tags: [Users]
      summary: Get my profile
      description: >-
        Returns the authenticated user's profile row. On the very first
        authenticated request the row is created automatically from the token's
        claims (email plus `first_name` / `last_name` from `user_metadata`).
      operationId: getMe
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Update my display name
      description: >-
        `email`, `status`, `auth_user_id` and `user_id` are rejected with `400`.
        The address belongs to Supabase Auth — change it with
        `supabase.auth.updateUser()` and this row re-syncs from the token on the
        next request.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Users]
      summary: Close my account
      description: >-
        Sets `status` to `withdrawn`, which every subsequent authenticated
        request rejects with `403`. The climbing history is deliberately kept:
        cascading the delete would take every session, report and injury with
        it, which is not what a mis-tap should cost. Deleting the Supabase Auth
        user is a separate, deliberate step.
      operationId: withdrawMe
      responses:
        '200':
          description: The closed profile, its status now `withdrawn`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stats:
    get:
      tags: [Stats]
      summary: Counted-up figures for the charts
      description: >-
        Every number the Dashboard and Progress screens display, aggregated in
        SQL. One response serves both screens; before this existed they each
        fetched the caller's entire unpaginated history and counted it in
        JavaScript.

        `month` and `today` both come from the client, because the server's date
        can be a different day in the climber's timezone and "this month" and
        "streak" are exactly the figures a reader notices being off by one.

        Ranges are half-open — `daily` covers the 30 days ending on `today`,
        inclusive.
      operationId: getStats
      parameters:
        - name: month
          in: query
          description: Calendar month to report on. Defaults to the month containing `today`.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          example: '2026-08'
        - name: today
          in: query
          description: The client's local date, anchoring the streak and the heatmap.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The aggregated figures.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Stats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      description: |
        One page of the authenticated user's visits, newest first by
        `visit_date` then `session_id`, each carrying a count of the climbs
        logged on it.

        `meta.total` is how many matched the filters in total, not how many
        were returned — enough to say "20 of 143" and to know whether another
        page exists.

        `q` matches the gym name or any route name logged on the visit,
        case-insensitively, as a substring.
      operationId: listSessions
      parameters:
        - name: limit
          in: query
          description: Page size. Default 20, maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: q
          in: query
          description: Substring of a gym name or a route name.
          schema:
            type: string
            maxLength: 150
        - name: from
          in: query
          description: Earliest `visit_date` to include (inclusive).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Latest `visit_date` to include (inclusive).
          schema:
            type: string
            format: date
        - name: grade_id
          in: query
          description: Only visits including at least one climb at this grade.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of the user's sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
                  meta:
                    type: object
                    required: [total]
                    properties:
                      total:
                        type: integer
                        description: Rows matching the filters, before paging.
                      limit:
                        type: integer
                      offset:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Sessions]
      summary: Create a session
      description: |
        The session is created for the authenticated user.

        `attempts` may be nested to save a whole gym visit in one call: each
        entry creates a route (from `grade_id` + `route_name`) plus an attempt
        on it. Session, routes and attempts are written in a single database
        transaction, so on any failure nothing is persisted.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              visit_date: '2026-07-07'
              gym_name: The Hive
              attempts:
                - grade_id: 3
                  route_name: Yellow slab by the door
                  is_success: true
                  note: Flashed it!
      responses:
        '201':
          description: Session (and any nested attempts) created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionWithAttempts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: An `attempts[].grade_id` does not reference an existing grade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  message: 'Operation conflicts with related data (foreign key constraint)'

  /sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Sessions]
      summary: Get a session
      operationId: getSession
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Sessions]
      summary: Update a session (partial)
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
      responses:
        '200':
          description: The updated session.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sessions]
      summary: Delete a session
      description: >-
        Also deletes its attempts (`ON DELETE CASCADE`), any route those climbs
        were the last reference to, and the stored photos and videos attached
        to any of them.
      operationId: deleteSession
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/attempts:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Sessions]
      summary: Add a climb to a saved session
      description: |
        The body is one climb — the same shape as one entry of the `attempts`
        array on `POST /sessions` — and is validated identically, so a route
        remembered afterwards is stored exactly as it would have been at the
        time.

        Route, attempt and every tag are written in one transaction. Ownership
        is checked against the session in the path inside that transaction;
        there is no id a caller could supply to reach someone else's visit.
      operationId: addSessionAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAttemptCreate'
      responses:
        '201':
          description: The created climb.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /grades:
    get:
      tags: [Grades]
      summary: List grades
      description: The V0–V17 scale, seeded once. Read-only.
      operationId: listGrades
      responses:
        '200':
          description: All grades.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grade'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /grades/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Grades]
      summary: Get a grade
      operationId: getGrade
      responses:
        '200':
          description: The grade.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Grade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /routes:
    get:
      tags: [Routes]
      summary: List my routes
      description: >-
        Every route behind one of the caller's logged attempts, newest first.

        Routes are created through `POST /sessions` (nested `attempts`), never
        directly, and they are read-only here: `routes` carries no owner column,
        so a write endpoint could not tell whose logged climb it was rewriting.
        Correcting the grade or name of a climb goes through
        `PATCH /attempts/{id}`.
      operationId: listRoutes
      responses:
        '200':
          description: The caller's routes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Route'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /routes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Routes]
      summary: Get a route
      description: >-
        Scoped through the caller's attempts — a route behind somebody else's
        climb answers `404`, not the row.
      operationId: getRoute
      responses:
        '200':
          description: The route.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /attempts:
    get:
      tags: [Attempts]
      summary: List attempts
      description: >-
        All attempts across the authenticated user's sessions. Attempts are
        created through `POST /sessions` (nested `attempts`), never directly.
      operationId: listAttempts
      parameters:
        - name: session_id
          in: query
          required: false
          description: Only return attempts belonging to this session (must be one of the user's sessions).
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The user's attempts (optionally filtered by session).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttemptWithRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /attempts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Attempts]
      summary: Get an attempt
      operationId: getAttempt
      responses:
        '200':
          description: The attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AttemptWithRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Attempts]
      summary: Update an attempt (partial)
      operationId: updateAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptUpdate'
      responses:
        '200':
          description: The updated attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AttemptWithRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Attempts]
      summary: Delete an attempt
      operationId: deleteAttempt
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /goals:
    get:
      tags: [Goals]
      summary: List goals
      description: The authenticated user's goals.
      operationId: listGoals
      responses:
        '200':
          description: The user's goals.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Goals]
      summary: Create a goal
      description: The goal is created for the authenticated user. `grade_id` must reference an existing grade.
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
            example:
              grade_id: 5
              goal_description: Send my first V4 before the season ends
              target_date: '2026-09-30'
      responses:
        '201':
          description: Goal created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /goals/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Goals]
      summary: Get a goal
      operationId: getGoal
      responses:
        '200':
          description: The goal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Goals]
      summary: Update a goal (partial)
      description: >-
        `achieved_at` is derived from `is_achieved` and cannot be set directly:
        it is stamped with the current time when `is_achieved` flips to `true`
        and cleared when it flips back to `false`.
      operationId: updateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdate'
      responses:
        '200':
          description: The updated goal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Goals]
      summary: Delete a goal
      operationId: deleteGoal
      responses:
        '204':
          description: Deleted. No content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /performances:
    get:
      tags: [Performances]
      summary: List performance reports
      description: |
        One page of the authenticated user's AI performance reports, pinned
        ones first and then newest first — a climber keeps a handful to check
        back against, and those should not sink below a month of newer ones.

        `meta.total` is how many matched the filters, so the caller can page
        and say how many exist.
      operationId: listPerformances
      parameters:
        - name: period_type
          in: query
          required: false
          description: Only reports of this period type.
          schema:
            type: string
            enum: [daily, monthly]
        - name: is_pinned
          in: query
          required: false
          description: >-
            `true` returns only pinned reports, `false` only unpinned. Omit for
            both.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Maximum number of reports to return (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: One page of the user's performance reports.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Performance'
                  meta:
                    type: object
                    required: [total]
                    properties:
                      total:
                        type: integer
                        description: Rows matching the filters, before paging.
                      limit:
                        type: integer
                      offset:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Performances]
      summary: Generate a performance report
      description: >-
        Aggregates the period's sessions/attempts, has the AI coach analyze
        them, and stores the result. `date` anchors the period — any day of the
        target day/month, defaulting to today. Synchronous; expect a few
        seconds of latency.
      operationId: createPerformance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceCreate'
            example:
              period_type: monthly
              date: '2026-08-06'
      responses:
        '201':
          description: Report generated and stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Performance'
        '400':
