        '200':
          description: One page of the user's training plans.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Training'
                  meta:
                    type: object
                    required: [total]
                    properties:
                      total:
                        type: integer
                        description: Rows matching the filters, before paging.
                      limit:
                        type: integer
                      offset:
                        type: integer
