    post:
      tags: [Weaknesses]
      summary: Add a weakness label
      description: >-
        Idempotent: a label matching an existing preset or one of the climber's
        own is returned rather than duplicated. This is what makes the
        "dropdown you can type into" produce aggregatable data.
      operationId: createWeakness
      requestBody:
        required: true
        content:
          application/json:
