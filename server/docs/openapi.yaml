          $ref: '#/components/responses/NotFound'

  /injuries/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Injuries]
      summary: List check-ins
      description: Oldest first, so the pain-trend chart can plot them as-is.
      operationId: listInjuryLogs
      responses:
        '200':
          description: The check-ins for this injury.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InjuryLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Injuries]
      summary: Check in for a day
      description: >-
        One entry per injury per day — re-posting the same date corrects that
        day rather than adding a second reading.
      operationId: createInjuryLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjuryLogCreate'
            example:
              pain_level: 3
              logged_on: '2026-08-15'
              note: Better than yesterday. No pain opening doors.
      responses:
